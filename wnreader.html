<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koboarcade Automated LN Reader</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body { font-family: serif; background-color: #fff; color: #000; margin: 5%; font-size: 20px; line-height: 1.5; }
        .reader-container { max-width: 500px; margin: 0 auto; text-align: center; }
        .header-banner { border-bottom: 2px solid #000; font-weight: bold; margin-bottom: 15px; padding-bottom: 5px; }
        .text-window { min-height: 320px; text-align: left; white-space: pre-wrap; margin: 20px 0; font-size: 21px; }
        .input-box { width: 90%; padding: 10px; font-family: monospace; border: 2px solid #000; font-size: 15px; margin: 10px 0; }
        .btn-action { display: inline-block; padding: 10px 20px; background: #fff; border: 2px solid #000; font-weight: bold; cursor: pointer; text-decoration: none; color: #000; margin: 5px; }
        .btn-action:active { background: #000; color: #fff; }
        .btn-action[disabled] { border-color: #ccc; color: #ccc; }
        .page-indicator { font-family: monospace; font-size: 15px; margin: 0 10px; }
    </style>
</head>
<body>

<div class="reader-container">
    <div class="header-banner" id="novel-title">LN CLOUD ROUTER v1</div>

    <!-- URL FETCH PANEL -->
    <div id="setup-panel">
        <p>Paste the direct Light Novel chapter URL below to let the Cloud proxy parse the raw text output:</p>
        <input type="text" id="target-url" class="input-box" placeholder="https://example-novel-site.com">
        <br>
        <button class="btn-action" onclick="fetchNovelChapter()">⚡ INJECT & PURGE CHAPTER</button>
        <div id="status-readout" style="margin-top: 15px; font-style: italic; font-size: 15px;">Status: Standby</div>
    </div>

    <!-- PURE INTERACTIVE READER SCREEN -->
    <div id="view-panel" style="display: none;">
        <div class="text-window" id="text-canvas">Loading...</div>
        
        <div>
            <button class="btn-action" id="prev-btn" onclick="turnPage(-1)">PREV</button>
            <span class="page-indicator" id="page-nav-text">1/1</span>
            <button class="btn-action" id="next-btn" onclick="turnPage(1)">NEXT</button>
        </div>
        <br>
        <button class="btn-action" style="font-size: 14px;" onclick="closeCartridge()">EJECT CARTRIDGE</button>
    </div>

    <div style="margin-top: 30px; border-top: 1px dashed #000; padding-top: 15px;">
        <a href="index.html" class="btn-action" style="font-size: 14px;">🏠 BACK TO CABINET</a>
    </div>
</div>

<script>
    // 🌐 PASTE YOUR UNIQUE CLOUDFLARE WORKER ROUTE URL HERE!
    var PROXY_WORKER_URL = "https://workers.dev";

    var chapterPages = [];
    var activePageIndex = 0;
    var characterDensityLimit = 650; // Tuned layout character limit for Kobo screens

    function fetchNovelChapter() {
        var inputUrl = document.getElementById("target-url").value;
        if (!inputUrl) return alert("Please drop a valid link first!");

        var readout = document.getElementById("status-readout");
        readout.innerHTML = "Dialing backend worker... bypassing Cloudflare...";

        // Execute background fetch call across the cloud bridge network
        var endpoint = PROXY_WORKER_URL + "?url=" + encodeURIComponent(inputUrl);

        var xhr = new XMLHttpRequest();
        xhr.open("GET", endpoint, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var responseData = JSON.parse(xhr.responseText);
                        if(responseData.text) {
                            paginateRawScrubbedText(responseData.text);
                            activePageIndex = 0;
                            document.getElementById("setup-panel").style.display = "none";
                            document.getElementById("view-panel").style.display = "block";
                            document.getElementById("novel-title").innerHTML = "CHAPTER PROCESSED";
                            renderPageSlice();
                        } else {
                            readout.innerHTML = "Error: Text buffer empty.";
                        }
                    } catch(e) {
                        readout.innerHTML = "Parsing crash: " + e.message;
                    }
                } else {
                    readout.innerHTML = "Connection failure. Code: " + xhr.status;
                }
            }
        };
        xhr.send();
    }

    function paginateRawScrubbedText(rawText) {
        chapterPages = [];
        var words = rawText.split(/\s+/);
        var currentSlice = "";

        for (var i = 0; i < words.length; i++) {
            currentSlice += words[i] + " ";
            if (currentSlice.length > characterDensityLimit) {
                chapterPages.push(currentSlice.trim());
                currentSlice = "";
            }
        }
        if (currentSlice.trim()) {
            chapterPages.push(currentSlice.trim());
        }
    }

    function renderPageSlice() {
        document.getElementById("text-canvas").innerHTML = chapterPages[activePageIndex];
        document.getElementById("page-nav-text").innerHTML = (activePageIndex + 1) + "/" + chapterPages.length;

        // Toggle disabled states for e-ink touch safety compatibility
        if (activePageIndex === 0) document.getElementById("prev-btn").setAttribute("disabled", "true");
        else document.getElementById("prev-btn").removeAttribute("disabled");

        if (activePageIndex === chapterPages.length - 1) document.getElementById("next-btn").setAttribute("disabled", "true");
        else document.getElementById("next-btn").removeAttribute("disabled");
    }

    function turnPage(step) {
        var computedIndex = activePageIndex + step;
        if (computedIndex >= 0 && computedIndex < chapterPages.length) {
            activePageIndex = computedIndex;
            renderPageSlice();
            window.scrollTo(0,0);
        }
    }

    function closeCartridge() {
        document.getElementById("setup-panel").style.display = "block";
        document.getElementById("view-panel").style.display = "none";
        document.getElementById("status-readout").innerHTML = "Status: Standby";
        document.getElementById("target-url").value = "";
        document.getElementById("novel-title").innerHTML = "LN CLOUD ROUTER v1";
    }
</script>

</body>
</html>
